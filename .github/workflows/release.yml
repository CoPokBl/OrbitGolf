name: Release

# Every push to main builds, signs and publishes an APK as a new GitHub release (v1.0.N,
# N = run number). Docs-only pushes are skipped. Can also be run by hand from the Actions tab.
# Obtainium: add the repo URL (https://github.com/CoPokBl/OrbitGolf) and it picks up the APK.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

# Don't let two quick pushes race to publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: ver
        run: |
          N=${{ github.run_number }}
          # run_number only goes up, so each release is an upgrade for Android and Obtainium.
          echo "tag=v1.0.$N" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$N" >> "$GITHUB_OUTPUT"
          echo "code=$((1000000 + N))" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing ORBIT_KEYSTORE_BASE64 secret. Without a fixed key, updates can't install over each other. See README > Releases."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ORBIT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test levels and generator
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*LevelsTest' --tests '*GeneratorTest'

      - name: Build signed APK
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ steps.ver.outputs.code }} -PversionName=${{ steps.ver.outputs.name }}
          cp app/build/outputs/apk/release/app-release.apk "OrbitGolf-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Orbit Golf ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: OrbitGolf-${{ steps.ver.outputs.tag }}.apk
